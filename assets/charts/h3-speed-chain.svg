<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="MiniMax-H3 test clip time on the GTX 1080"><title>MiniMax-H3 test clip time on the GTX 1080</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e11"/><stop offset="1" stop-color="#151a20"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d7a00"/><stop offset="1" stop-color="#76b900"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="510" rx="14" fill="url(#bg)"/><text x="32" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1">MiniMax-H3 on 8 GB: 674.5 s to 175.5 s</text><text x="32" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1">320x576, 39 frames, seed 42, weights streamed from disk. Seconds, lower is better.</text><text x="32" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">baseline: Q2 DiT, 8 steps</text><rect x="360" y="114" width="500.0" height="26" rx="6" fill="#4b535d"/><text x="870.0" y="133" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#8b949e" text-anchor="start" opacity="1">674.5 s</text><text x="32" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">one read stream (-t 1)</text><rect x="360" y="164" width="247.7" height="26" rx="6" fill="url(#gr)"/><text x="617.7390659747962" y="183" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">334.2 s   -50%</text><text x="32" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">turbo LoRA 4 steps + two sd.cpp fixes</text><rect x="360" y="214" width="197.0" height="26" rx="6" fill="url(#gr)"/><text x="566.9607116382506" y="233" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">265.7 s   -61%</text><text x="32" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">next segment read while the GPU computes</text><rect x="360" y="264" width="184.5" height="26" rx="6" fill="url(#gr)"/><text x="554.5070422535211" y="283" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">248.9 s   -63%</text><text x="32" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">VAE in tile groups with prefetch</text><rect x="360" y="314" width="164.0" height="26" rx="6" fill="url(#gr)"/><text x="533.9733135656041" y="333" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">221.2 s   -67%</text><text x="32" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">embedding rows from file, LoRA scales, FA on</text><rect x="360" y="364" width="155.1" height="26" rx="6" fill="url(#gr)"/><text x="525.0778354336546" y="383" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">209.2 s   -69%</text><text x="32" y="432" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="1">Q3 recipe: Q8 VAE, 4B encoder, int8 attention</text><rect x="360" y="414" width="130.1" height="26" rx="6" fill="url(#gr)"/><text x="500.0963676797628" y="433" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#76b900" text-anchor="start" opacity="1">175.5 s   -74%</text><text x="32" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1">Source: my run logs, see docs/06 section 6.4.2. The last row was measured twice: 175.705 s and 175.26 s.</text></svg>